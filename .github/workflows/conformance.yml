name: conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-23
        with:
          python-version: '3.13'
      - name: Validate independent corpus and package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/verify.py --output local-results/tests.json
      - name: Run packaged CLI
        run: python -I dist/agent-permission-clinic.pyz --output local-results/permission-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-11-23
        with:
          name: clinic-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/agent-permission-clinic.pyz
            local-results/permission-report.json
            local-results/tests.json
          if-no-files-found: error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, resolved 2026-11-23
        with:
          name: clinic-${{ matrix.os }}-${{ github.sha }}
          path: local-results/downloaded
      - name: Execute downloaded artifact from isolated mode
        run: python -I local-results/downloaded/agent-permission-clinic.pyz --output local-results/downloaded-report.json
      - name: Verify downloaded report equals source report
        run: python -c "import json,pathlib; a=json.loads(pathlib.Path('local-results/permission-report.json').read_text()); b=json.loads(pathlib.Path('local-results/downloaded-report.json').read_text()); assert a == b"
