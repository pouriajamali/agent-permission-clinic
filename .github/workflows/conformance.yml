name: conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-23
        with:
          persist-credentials: false
      - name: Validate independent corpus and package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Run packaged CLI
        run: python -I dist/agent-permission-clinic.pyz --output local-results/permission-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-11-23
        with:
          name: clinic-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/agent-permission-clinic.pyz
            local-results/permission-report.json
          if-no-files-found: error
